on:
  push:
    tags:
      - 'v*'
name: Create release

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Build assets
        run: npm run build
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
      - name: Clean vendor directory and composer.lock
        run: |
          rm -rf vendor
          rm -f composer.lock
      - name: Install production dependencies
        run: |
          composer install --no-dev --no-interaction --optimize-autoloader --classmap-authoritative
      - name: Scope dependencies with Strauss
        run: |
          curl -o strauss.phar -L -s https://github.com/BrianHenryIE/strauss/releases/latest/download/strauss.phar
          php strauss.phar
          php bin/patch-implicit-nullable.php
          composer dump-autoload --no-dev --optimize --classmap-authoritative
      - name: Verify dependencies were scoped
        run: |
          if [ ! -f "vendor-prefixed/autoload.php" ]; then
            echo "Error: vendor-prefixed/autoload.php not found - Strauss did not run"
            exit 1
          fi
          if [ -d "vendor/php-di" ]; then
            echo "Error: unprefixed php-di still present in vendor - scoping failed"
            exit 1
          fi
          echo "Dependencies scoped successfully"
      - name: Verify no dev dependencies
        run: |
          if [ -d "vendor/phpstan" ]; then
            echo "Error: PHPStan directory found in vendor - dev dependencies installed"
            exit 1
          fi
          if [ -d "vendor/phpunit" ]; then
            echo "Error: PHPUnit directory found in vendor - dev dependencies installed"
            exit 1
          fi
          echo "No dev dependencies found in vendor directory"
      - name: Verify release payload is clean
        run: |
          # The PHP 8.4 nullable patch must have been applied to the scoped copies.
          php bin/patch-implicit-nullable.php --check

          # A botched Strauss run once copied an entire Composer home - auth.json
          # included - into vendor-prefixed/. The zip below ships vendor-prefixed/
          # wholesale, so refuse to package anything that looks like a credential.
          leaked=$(find vendor vendor-prefixed \
            \( -name 'auth.json' -o -name 'auth.jsonbak' -o -name '.netrc' \
               -o -name '.npmrc' -o -name '.env' -o -name 'id_rsa*' \) -print)
          if [ -n "$leaked" ]; then
            echo "Error: credential-like files found in the release payload:"
            echo "$leaked"
            exit 1
          fi

          # Same failure mode, detected structurally: scoped packages never contain
          # a vendor directory of their own.
          nested=$(find vendor-prefixed -type d -name vendor -print)
          if [ -n "$nested" ]; then
            echo "Error: nested vendor directory inside vendor-prefixed - Strauss copied something it should not have:"
            echo "$nested"
            exit 1
          fi

          echo "Release payload is clean"
      - name: Create zip file
        run: |
          zip -r auto-alt-text.zip *.php composer.json composer.lock readme.txt dist languages src vendor vendor-prefixed -x "*.git*"
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: auto-alt-text.zip
          body_path: release-body.md
